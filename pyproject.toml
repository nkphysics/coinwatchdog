[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coinwatchdog"
version = "0.0.1"
description = ""
authors = [
  {name = "Nicholas Kuechel", email = "njkuechel@protonmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "websockets >= 15.0.1"
]

[project.optional-dependencies]
dev = [
    "build >= 0.10.0",
    "flake8 >= 7.1.1",
]

[project.scripts]
coinwatchdog = 'coinwatchdog:entry'